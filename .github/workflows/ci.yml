name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  # Every platform runs the suite and the selftest on real hardware.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: selftest (generates + validates for all platforms)
        run: python remap.py selftest

  # The decisive macOS gate: hand our generated rule to Karabiner's own linter,
  # on a real Mac.
  macos-karabiner:
    name: karabiner lint (real macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: generate the Karabiner rule
        run: |
          python - <<'PY'
          from keyremap.config import load
          from keyremap.backends import macos
          cfg = load("config.yaml", plat="darwin", host="ci")
          open("keyremap.json", "w").write(macos.generate(cfg))
          print(open("keyremap.json").read()[:400])
          PY

      - name: install Karabiner-Elements
        id: kara
        continue-on-error: true
        run: brew install --cask karabiner-elements

      - name: lint with karabiner_cli (the real validator)
        run: |
          CLI="/Library/Application Support/org.pqrs/Karabiner-Elements/bin/karabiner_cli"
          if [ ! -x "$CLI" ]; then
            CLI="$(command -v karabiner_cli || true)"
          fi
          if [ -z "$CLI" ] || [ ! -x "$CLI" ]; then
            echo "::error::karabiner_cli not found — the real linter did NOT run"
            exit 1
          fi
          echo "using $CLI"
          "$CLI" --version || true
          "$CLI" --lint-complex-modifications keyremap.json
          echo "karabiner_cli accepted the generated rule"

      - name: install into Karabiner's assets dir and re-lint from there
        run: |
          mkdir -p ~/.config/karabiner/assets/complex_modifications
          # a realistic karabiner.json with a selected profile and a user rule
          cat > ~/.config/karabiner/karabiner.json <<'JSON'
          {
            "global": {"show_in_menu_bar": true},
            "profiles": [
              {"name": "Default", "selected": true,
               "complex_modifications": {
                 "rules": [{"description": "a rule the user already had",
                            "manipulators": []}]}}
            ]
          }
          JSON
          python remap.py apply
          ls -l ~/.config/karabiner/assets/complex_modifications/
          CLI="/Library/Application Support/org.pqrs/Karabiner-Elements/bin/karabiner_cli"
          "$CLI" --lint-complex-modifications \
            ~/.config/karabiner/assets/complex_modifications/keyremap.json

      - name: verify the rule was ENABLED in the selected profile
        run: |
          python - <<'PY'
          import json, os, sys
          p = os.path.expanduser("~/.config/karabiner/karabiner.json")
          doc = json.load(open(p))                    # must still be valid JSON
          prof = [x for x in doc["profiles"] if x.get("selected")][0]
          rules = prof["complex_modifications"]["rules"]
          descs = [r.get("description", "") for r in rules]
          assert any(d.startswith("keyremap:") for d in descs), \
              f"keyremap rules not enabled: {descs}"
          assert "a rule the user already had" in descs, \
              "the user's existing rule was clobbered"
          assert os.path.exists(p + ".keyremap-backup"), "no backup written"
          print("enabled in profile:", descs)
          PY
          # re-running must not duplicate
          python remap.py apply >/dev/null
          python - <<'PY'
          import json, os
          p = os.path.expanduser("~/.config/karabiner/karabiner.json")
          rules = [x for x in json.load(open(p))["profiles"][0]
                   ["complex_modifications"]["rules"]
                   if x.get("description", "").startswith("keyremap:")]
          assert len(rules) == 1, f"re-apply duplicated rules: {len(rules)}"
          print("idempotent on re-apply: 1 rule")
          PY

      - name: doctor runs clean on a real Mac (permission checks included)
        run: |
          python remap.py doctor || true      # warnings expected on a runner
          python - <<'PY'
          from keyremap.config import load
          from keyremap import doctor
          rows = doctor.run(load("config.yaml"))
          labels = [r[1] for r in rows]
          for need in ("Karabiner driver extension", "Karabiner engine",
                       "karabiner_cli lint"):
              assert need in labels, f"doctor lost the {need!r} check"
          # nothing may crash, and every row must be a 4-tuple of strings
          for r in rows:
              assert len(r) == 4 and all(isinstance(x, str) for x in r), r
          print("doctor rows:", len(rows))
          PY

      - name: karabiner_cli must still accept the whole config
        run: |
          CLI="/Library/Application Support/org.pqrs/Karabiner-Elements/bin/karabiner_cli"
          "$CLI" --lint-complex-modifications \
            ~/.config/karabiner/assets/complex_modifications/keyremap.json
          echo "rule installed, enabled, idempotent, and accepted by karabiner_cli"

  # The user's actual first five minutes on a new machine, executed verbatim:
  # install.sh -> keyremap doctor -> keyremap selftest -> keyremap apply.
  # If install.sh is broken on macOS, nothing else matters.
  fresh-machine:
    name: fresh-machine journey (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: run install.sh exactly as a new user would
        run: |
          ./install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: the installed launcher must work from anywhere
        run: |
          cd /                       # nowhere near the checkout
          which keyremap
          keyremap check
          keyremap doctor || true    # warnings expected on a runner
          # setup exits non-zero while blockers remain (correct for scripting);
          # a runner has no Karabiner, so tolerate it and assert it still guides.
          keyremap setup --dry-run > /tmp/setup.out 2>&1 || true
          cat /tmp/setup.out
          grep -q "keyremap setup" /tmp/setup.out
          keyremap selftest

      - name: config is installed and re-running never clobbers it
        run: |
          test -f "$HOME/.keyremap/app/config.yaml"
          echo "# user edit that must survive a re-install" >> "$HOME/.keyremap/app/config.yaml"
          ./install.sh >/dev/null
          grep -q "user edit that must survive" "$HOME/.keyremap/app/config.yaml" \
            && echo "re-install preserved the user's config"

      - name: export/import round-trip through the installed CLI
        run: |
          cd "$HOME"
          keyremap export --out "$HOME/mine.keyremap"
          keyremap import "$HOME/mine.keyremap"
          keyremap check | tail -3

      - name: apply through the installed CLI (macOS only — it enables the rule)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/.config/karabiner/assets/complex_modifications
          printf '{"profiles":[{"name":"Default","selected":true,"complex_modifications":{"rules":[]}}]}' \
            > ~/.config/karabiner/karabiner.json
          keyremap apply
          python - <<'PY'
          import json, os
          p = os.path.expanduser("~/.config/karabiner/karabiner.json")
          rules = json.load(open(p))["profiles"][0]["complex_modifications"]["rules"]
          assert any(r["description"].startswith("keyremap:") for r in rules), rules
          print("fresh machine -> rule live in Karabiner's profile")
          PY

      - name: uninstall leaves nothing behind
        run: |
          rm -rf "$HOME/.keyremap/app" "$HOME/.local/bin/keyremap"
          test ! -e "$HOME/.local/bin/keyremap" && echo "clean uninstall"

  # "Barely noticeable" is a number, not a claim — and it must stay one.
  performance:
    name: performance budget (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: measure and enforce budgets
        run: python tests/bench.py

  # Mac users reach for brew first. Prove the formula actually installs and
  # that its `test do` block passes — on a real Mac, from source.
  homebrew:
    name: brew install (real macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: audit + install the formula from source
        run: |
          brew tap-new local/keyremap --no-git
          cp Formula/keyremap.rb "$(brew --repository)/Library/Taps/local/homebrew-keyremap/Formula/"
          brew audit --formula --strict local/keyremap/keyremap || true
          brew install --build-from-source --HEAD local/keyremap/keyremap
      - name: the installed binary must work
        run: |
          which keyremap
          keyremap --help | head -3
          keyremap check | tail -3
          keyremap selftest
      - name: run the formula's own test block
        run: brew test local/keyremap/keyremap
      - name: uninstall cleanly
        run: |
          brew uninstall local/keyremap/keyremap
          test ! -e "$(brew --prefix)/bin/keyremap" && echo "clean uninstall"

  # The decisive Linux gate: a REAL kernel device, a real grab, real uinput.
  linux-uinput:
    name: real kernel grab (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: enable uinput and install evdev
        run: |
          sudo modprobe uinput
          ls -l /dev/uinput
          sudo chmod 666 /dev/uinput
          python -m pip install --quiet evdev
          echo "PYBIN=$(which python)" >> "$GITHUB_ENV"
      - name: create a virtual keypad, grab it, and verify remapped output
        run: sudo -E "$PYBIN" tests/linux_live_test.py
