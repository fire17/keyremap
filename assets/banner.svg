<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" role="img"
     aria-label="keyremap — one keyboard, remapped. Every computer, the same.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="55%" stop-color="#101a2e"/>
      <stop offset="100%" stop-color="#151033"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5cc8ff"/>
      <stop offset="100%" stop-color="#c3a6ff"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5cc8ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5cc8ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>

  <!-- motif: two keycaps emitting the same signal, one intercepted.
       The whole project in one picture. -->
  <g transform="translate(910 74)" fill="none" stroke-width="2">
    <g stroke="#33415c">
      <rect x="0"   y="0"  width="86" height="86" rx="14"/>
      <rect x="10"  y="10" width="66" height="66" rx="9" stroke="#26314a"/>
    </g>
    <g stroke="#5cc8ff" transform="translate(0 106)">
      <rect x="0"   y="0"  width="86" height="86" rx="14"/>
      <rect x="10"  y="10" width="66" height="66" rx="9" stroke="#3a7ea8"/>
    </g>
    <path d="M104 43 H196" stroke="#33415c" stroke-dasharray="5 7"/>
    <path d="M104 149 H196" stroke="#5cc8ff" stroke-dasharray="5 7"/>
    <g stroke="#c3a6ff">
      <rect x="196" y="106" width="86" height="86" rx="14"/>
      <path d="M214 149 h50 M252 137 l12 12 -12 12" stroke-linecap="round"/>
    </g>
    <text x="128" y="34" fill="#66718c" font-family="Verdana, Geneva, sans-serif"
          font-size="13">untouched</text>
    <text x="120" y="212" fill="#7fd3ff" font-family="Verdana, Geneva, sans-serif"
          font-size="13">remapped</text>
  </g>

  <text x="96" y="132" font-family="Georgia, 'Times New Roman', serif"
        font-size="76" fill="url(#accent)">keyremap</text>

  <text x="100" y="180" font-family="Georgia, 'Times New Roman', serif"
        font-size="27" font-style="italic" fill="#aab4c8">
    One keyboard, remapped. Every computer, the same.
  </text>

  <rect x="100" y="206" width="560" height="2" fill="url(#rule)"/>

  <text x="100" y="248" font-family="Verdana, Geneva, sans-serif"
        font-size="15" fill="#7f8aa3" letter-spacing="2.5">
    macOS · WINDOWS · LINUX
  </text>
  <text x="100" y="284" font-family="Verdana, Geneva, sans-serif"
        font-size="15" fill="#5ddba4" letter-spacing="1.5">
    ZERO DEPENDENCIES · 70 TESTS · VERIFIED ON REAL HARDWARE IN CI
  </text>
</svg>
