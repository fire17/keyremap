# keyremap — portable per-device key remapping.
#
# This file travels with you. Plug the same device into any machine, run
# `keyremap apply`, and you get the same behaviour — because devices are
# identified by their hardware id, not by a port or a driver name.
#
# Layers merge in order: base -> os:<platform> -> host:<hostname>
#   base        the portable truth, applies everywhere
#   os:         only on that platform (darwin | windows | linux | wsl)
#   host:       only on that machine (hostname, lower-case)
# A later layer overrides a single key; `key: null` removes an inherited one.

version: 2

devices:
  keypad:
    match:
      vendor_id: 0x045E
      product_id: 0x0040
      name_contains: "Keypad"

options:
  passthrough_unmapped: true
  # Some BLE keypads implement nav keys by toggling NumLock around a numpad
  # scancode. Swallow that churn so system NumLock state is not disturbed.
  swallow_numlock_quirk: true

profiles:
  # ---------------------------------------------------------------- base ----
  # Everything here applies on every computer this config lands on.
  base:
    keypad:
      backspace: end       # physical "clear" key
      equal: pagedown      # physical "=" key
      tab: pageup
      esc: home
      delete: backspace    # keypad "del" deletes backwards
      insert: delete       # keypad "ins" deletes forwards

      # A key can BE a modifier — held for as long as you hold it.
      pagedown: lctrl
      pageup: lshift

      # "accel" = Ctrl on Windows/Linux, Command on macOS. One line, both OSes.
      end: accel+v         # paste

      # Tap selects all (on release); holding past 400ms selects all AND copies,
      # so seeing the selection appear late proves the copy happened too.
      home:
        tap: accel+a
        hold: [accel+a, accel+c]
        hold_ms: 400

  # ------------------------------------------------------------ overrides ----
  # Per-platform tweaks. Everything not listed is inherited from base.
  os:
    darwin: {}
    windows: {}
    linux: {}

  # Per-machine tweaks, keyed by hostname (lower-case).
  host: {}
